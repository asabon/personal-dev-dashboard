name-template: 'Next Release'

autolabeler:
  - label: 'feature'
    title:
      - '^\[Feature\]'
      - '^feat(\(.*\))?:'
    branch:
      - '^feature/'
  - label: 'fix'
    title:
      - '^\[Fix\]'
      - '^fix(\(.*\))?:'
    branch:
      - '^fix/'
  - label: 'refactor'
    title:
      - '^\[Refactor\]'
      - '^refactor(\(.*\))?:'
    branch:
      - '^refactor/'
  - label: 'docs'
    title:
      - '^\[Docs\]'
      - '^docs(\(.*\))?:'
    branch:
      - '^docs/'
  - label: 'chore'
    title:
      - '^\[Chore\]'
      - '^chore(\(.*\))?:'
    branch:
      - '^chore/'
  - label: 'test'
    title:
      - '^\[Test\]'
      - '^test(\(.*\))?:'
    branch:
      - '^test/'

categories:
  - title: '🚀 新機能 / Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 バグ修正 / Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '♻️ リファクタリング / Refactoring'
    labels:
      - 'refactor'
  - title: '📖 ドキュメント / Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: '🧰 保守・ビルド・CI / Maintenance & Chore'
    labels:
      - 'chore'
      - 'test'
      - 'dependencies'
      - 'ci'

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

template: |
  ## 変更内容 / What's Changed

  $CHANGES
