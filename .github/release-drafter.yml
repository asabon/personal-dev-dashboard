name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 新機能・機能改善 (Features)'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 不具合修正 (Bug Fixes)'
    labels:
      - 'fix'
      - 'bug'
  - title: '🛠 メンテナンス・その他 (Maintenance & Chores)'
    labels:
      - 'chore'
      - 'documentation'
      - 'docs'
      - 'ci'
      - 'dependencies'

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'chore'
      - 'docs'
  default: patch

template: |
  ## 変更点

  $CHANGES
