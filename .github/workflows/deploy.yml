name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish_release:
    name: Publish Release
    needs: deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Release Drafter が作成したドラフト Release を検索して正式 Release として昇格・公開
          DRAFT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == true) | .id' | head -n 1)

          if [ -n "$DRAFT_ID" ]; then
            echo "Publishing draft release ID: $DRAFT_ID as $TAG_NAME"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
              -f tag_name="$TAG_NAME" \
              -f name="$TAG_NAME" \
              -F draft=false \
              -F make_latest=true
          else
            echo "No draft release found. Creating a new release for $TAG_NAME"
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi
